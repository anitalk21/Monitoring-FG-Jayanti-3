<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Operator Antrian</title>
    <style>
        /* CSS INTERNAL: Desain Pastel Light Mode */
        body { background-color: #f8fafc; color: #334155; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; font-size: 12px; }
        
        /* Bar Navigasi Atas (Sesuai Referensi Gambar) */
        .nav-bar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .nav-actions { display: flex; gap: 8px; }
        .btn-nav { padding: 6px 12px; border-radius: 6px; border: 1px solid #e2e8f0; background: #f8fafc; cursor: pointer; font-size: 11px; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 5px; }
        .btn-nav:hover { background: #f1f5f9; }
        .btn-nav.active { background: #e0e7ff; color: #4338ca; border-color: #c7d2fe; }

        /* Style lainnya tetap sama */
        .marquee { background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 0; overflow: hidden; white-space: nowrap; font-weight: 600; color: #475569; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #cbd5e1; font-weight: 600; background: white; }
        .btn-primary { background: #6366f1; color: white; border-color: #6366f1; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 450px; }
    </style>
</head>
<body>

<!-- BAR MENU NAVIGASI (SESUAI REFERENSI) -->
<header class="nav-bar">
    <div style="font-weight:bold; font-size:14px; color:#1e293b;">Dashboard Operator</div>
    <div class="nav-actions">
        <button class="btn-nav" onclick="toggleModal()"><i class="fa-solid fa-plus"></i> Daftar Manual</button>
        <button class="btn-nav"><i class="fa-solid fa-tv"></i> Layar</button>
        <button class="btn-nav"><i class="fa-solid fa-qrcode"></i> QR</button>
        <button class="btn-nav"><i class="fa-solid fa-user-check"></i> Approval</button>
        <button class="btn-nav"><i class="fa-solid fa-gear"></i></button>
        <button class="btn-nav" style="background:#fee2e2; border-color:#fecaca; color:#991b1b;">← Keluar</button>
    </div>
</header>

<div class="marquee">
    <marquee scrollamount="6">
        🟢 Keluar: 4 Truk | 🔵 Lokal Proses: 4 Truk | ✅ Lokal Selesai: 4 Truk | 📦 Antrian: 1 Truk | 🚚 SUBDIST Proses: 3 Truk
    </marquee>
</div>

<div class="container">
    <!-- Kolom Pencarian -->
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <input type="text" id="searchInput" class="form-control" placeholder="Cari nomor / nama / no.pol / jenis / tujuan / no.dok..." style="width:100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;" oninput="renderAntrianCards()">
    </div>

    <!-- Status Tab (Sesuai Referensi Gambar) -->
    <div style="display:flex; gap:10px; margin-bottom:15px; overflow-x:auto;">
        <button class="btn-nav active">Antrian (1)</button>
        <button class="btn-nav">Nunggu Dokumen</button>
        <button class="btn-nav">Proses Muat (7)</button>
        <button class="btn-nav">Selesai Muat (2)</button>
        <button class="btn-nav">Keluar</button>
        <button class="btn-nav">Loading Dock (9/9)</button>
        <button class="btn-nav">Semua (11)</button>
        <button class="btn-nav">Analisis</button>
    </div>

    <div id="antrianCardContainer"></div>
</div>

<!-- Modal Daftar Manual -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h4 style="margin-top:0;">Daftar Manual Truk</h4>
        <form id="formManual" onsubmit="submitAntrian(event)">
            <input type="text" id="mSopir" class="form-control" required placeholder="Nama Sopir" style="margin-bottom:10px; width:100%; padding:8px;">
            <input type="text" id="mNoPol" class="form-control" required placeholder="No Polisi" style="margin-bottom:10px; width:100%; padding:8px;">
            <button type="submit" class="btn btn-primary">Simpan Antrian</button>
            <button type="button" class="btn" onclick="toggleModal()">Batal</button>
        </form>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('antrian')) || [];
    function toggleModal() { const m = document.getElementById('modal'); m.style.display = (m.style.display === 'flex' ? 'none' : 'flex'); }
    
    function submitAntrian(e) {
        e.preventDefault();
        data.unshift({ id: "L0"+Math.floor(Math.random()*99), sopir: document.getElementById('mSopir').value, nopol: document.getElementById('mNoPol').value, status: 'Antrian' });
        localStorage.setItem('antrian', JSON.stringify(data));
        toggleModal();
        renderAntrianCards();
    }

    function renderAntrianCards() {
        const cont = document.getElementById('antrianCardContainer');
        cont.innerHTML = data.length === 0 ? '<div class="card">Belum ada data antrian.</div>' : '';
        data.forEach(item => {
            cont.innerHTML += `<div class="card">
                <div style="font-weight:bold; color:#4f46e5;">${item.id} - ${item.nopol} (${item.sopir})</div>
                <div style="font-size:11px; color:#64748b;">Status: ${item.status}</div>
            </div>`;
        });
    }
    renderAntrianCards();
</script>
</body>
</html>
