<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Antrian</title>
    <style>
        body { background-color: #f8fafc; color: #334155; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; font-size: 12px; }
        .nav-bar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-nav { padding: 6px 12px; border-radius: 6px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font-weight: 600; color: #475569; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; border: 1px solid #cbd5e1; }
        .btn-primary { background: #6366f1; color: white; border: none; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 450px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #64748b; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<header class="nav-bar">
    <div style="font-weight:bold; font-size:14px; color:#1e293b;">Dashboard Antrian</div>
    <div>
        <button class="btn" onclick="toggleModal('modalManual')">+ Daftar Manual</button>
        <a href="monitoring.html" style="margin-left:10px;">Monitoring Utama</a>
    </div>
</header>

<div class="container">
    <div id="antrianCardContainer"></div>
</div>

<!-- Modal Daftar Manual (Sesuai Form Referensi) -->
<div id="modalManual" class="modal">
    <div class="modal-content">
        <h3>Ambil Nomor Antrian</h3>
        <form id="formManual" onsubmit="submitAntrian(event)">
            <div class="form-group"><label>Nama Sopir *</label><input type="text" id="mSopir" required></div>
            <div class="form-group"><label>Nama Ekspedisi *</label><input type="text" id="mEkspedisi" required></div>
            <div class="form-group"><label>No. Polisi *</label><input type="text" id="mNoPol" required></div>
            <div class="form-group"><label>Quantity (Karton)</label><input type="number" id="mQty"></div>
            <div class="form-group"><label>Jenis Pengiriman *</label><select id="mJenis"><option>LOKAL</option><option>EKSPOR</option></select></div>
            <button type="submit" class="btn btn-primary">Ambil Nomor Antrian</button>
            <button type="button" class="btn" onclick="toggleModal('modalManual')">Batal</button>
        </form>
    </div>
</div>

<!-- Modal Pindah Status & Loading Dock -->
<div id="modalStatus" class="modal">
    <div class="modal-content">
        <h3>Pindah Status</h3>
        <div class="form-group">
            <label>Pilih Status Baru</label>
            <select id="selectStatus" onchange="checkLoadingDock()">
                <option value="Antrian">Antrian</option>
                <option value="Nunggu Dokumen">Nunggu Dokumen</option>
                <option value="Proses Muat">Proses Muat</option>
                <option value="Selesai Muat">Selesai Muat</option>
                <option value="Keluar">Keluar</option>
            </select>
        </div>
        <div id="dockContainer" class="form-group" style="display:none;">
            <label>Pilih Loading Dock</label>
            <select id="selectDock"><option>Dock 01</option><option>Dock 02</option><option>Dock 03</option></select>
        </div>
        <button class="btn btn-primary" onclick="saveStatus()">Simpan</button>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('antrian')) || [];
    let activeIdx = null;

    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex' ? 'none' : 'flex'); }
    
    function submitAntrian(e) {
        e.preventDefault();
        data.unshift({ 
            id: "L0"+Math.floor(Math.random()*99), 
            sopir: document.getElementById('mSopir').value, 
            nopol: document.getElementById('mNoPol').value, 
            status: 'Antrian',
            dock: '-'
        });
        localStorage.setItem('antrian', JSON.stringify(data));
        toggleModal('modalManual');
        renderAntrianCards();
    }

    function openStatusModal(idx) { activeIdx = idx; toggleModal('modalStatus'); }

    function checkLoadingDock() {
        document.getElementById('dockContainer').style.display = 
            (document.getElementById('selectStatus').value === 'Proses Muat') ? 'block' : 'none';
    }

    function saveStatus() {
        data[activeIdx].status = document.getElementById('selectStatus').value;
        data[activeIdx].dock = document.getElementById('selectDock').value;
        localStorage.setItem('antrian', JSON.stringify(data));
        toggleModal('modalStatus');
        renderAntrianCards();
    }

    function renderAntrianCards() {
        const cont = document.getElementById('antrianCardContainer');
        cont.innerHTML = data.length === 0 ? '<div class="card">Belum ada data antrian.</div>' : '';
        data.forEach((item, idx) => {
            cont.innerHTML += `<div class="card">
                <div style="font-weight:bold; color:#6366f1;">${item.id} - ${item.nopol}</div>
                <div>Sopir: ${item.sopir} | Status: ${item.status} ${item.dock !== '-' ? '(Dock: '+item.dock+')' : ''}</div>
                <button class="btn" style="margin-top:10px;" onclick="openStatusModal(${idx})">Pindah Status</button>
            </div>`;
        });
    }
    renderAntrianCards();
</script>
</body>
</html>
