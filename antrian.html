<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Antrian - PT. Mayora Indah</title>
    <style>
        /* Desain Pastel Light Mode */
        body { background-color: #f8fafc; color: #475569; font-family: 'Segoe UI', sans-serif; margin: 0; font-size: 12px; }
        .header { background: white; border-bottom: 1px solid #e2e8f0; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; }
        .marquee { background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 20px; font-weight: 600; color: #64748b; overflow: hidden; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        /* Card & Button Styles */
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .btn { padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; border: 1px solid #cbd5e1; background: white; transition: 0.2s; }
        .btn-primary { background: #6366f1; color: white; border: none; }
        .btn-primary:hover { background: #4f46e5; }
        
        /* Tabs & Search */
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        .tab-btn { padding: 6px 12px; cursor: pointer; border: none; background: none; font-weight: 600; color: #94a3b8; }
        .tab-btn.active { color: #6366f1; border-bottom: 2px solid #6366f1; }
        
        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 400px; }
        .form-group { margin-bottom: 10px; }
        label { font-size: 11px; font-weight: bold; color: #64748b; }
        input, select { width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<header class="header">
    <div style="font-weight:bold; font-size:15px; color:#1e293b;">Dashboard Antrian</div>
    <div>
        <a href="monitoring.html" style="margin-right:15px; text-decoration:none; color:#6366f1;">Monitoring</a>
        <button class="btn btn-primary" onclick="toggleModal('modalManual')">+ Daftar Manual</button>
    </div>
</header>

<div class="marquee">
    <marquee scrollamount="5">
        🟢 Keluar: 4 Truk | 🔵 Lokal Proses: 4 Truk | ✅ Lokal Selesai: 4 Truk | 📦 Antrian: 1 Truk | 🚚 SUBDIST Proses: 3 Truk
    </marquee>
</div>

<div class="container">
    <input type="text" id="searchInput" class="form-control" placeholder="Cari nomor / nama / no.pol / tujuan..." style="margin-bottom:15px;" oninput="renderCards()">

    <div class="tabs">
        <button class="tab-btn active" onclick="filterStatus('Semua')">Semua</button>
        <button class="tab-btn" onclick="filterStatus('Antrian')">Antrian</button>
        <button class="tab-btn" onclick="filterStatus('Proses Muat')">Proses Muat</button>
    </div>

    <div id="antrianCardContainer"></div>
</div>

<!-- Modal Daftar Manual -->
<div id="modalManual" class="modal">
    <div class="modal-content">
        <h4 style="margin-top:0;">Ambil Nomor Antrian</h4>
        <form onsubmit="submitAntrian(event)">
            <div class="form-group"><label>Nama Sopir *</label><input type="text" id="mSopir" required></div>
            <div class="form-group"><label>No. Polisi *</label><input type="text" id="mNoPol" required></div>
            <div class="form-group"><label>Jenis Pengiriman</label><select id="mJenis"><option>LOKAL</option><option>EKSPOR</option></select></div>
            <button type="submit" class="btn btn-primary">Simpan</button>
        </form>
    </div>
</div>

<!-- Modal Status -->
<div id="modalStatus" class="modal">
    <div class="modal-content">
        <h4>Pindah Status</h4>
        <select id="selectStatus" onchange="checkDock()">
            <option value="Antrian">Antrian</option>
            <option value="Proses Muat">Proses Muat</option>
            <option value="Keluar">Keluar</option>
        </select>
        <div id="dockDiv" style="display:none; margin-top:10px;">
            <label>Pilih Loading Dock</label>
            <select id="selectDock"><option>Dock 01</option><option>Dock 02</option></select>
        </div>
        <button class="btn btn-primary" onclick="saveStatus()" style="margin-top:15px;">Update</button>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('antrian')) || [];
    let filter = 'Semua';
    let activeIdx = null;

    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex' ? 'none' : 'flex'); }
    function filterStatus(s) { filter = s; renderCards(); }
    function checkDock() { document.getElementById('dockDiv').style.display = (document.getElementById('selectStatus').value === 'Proses Muat' ? 'block' : 'none'); }
    
    function submitAntrian(e) {
        e.preventDefault();
        data.unshift({ id: "L0"+Math.floor(Math.random()*99), sopir: document.getElementById('mSopir').value, nopol: document.getElementById('mNoPol').value, status: 'Antrian', dock: '-' });
        localStorage.setItem('antrian', JSON.stringify(data));
        toggleModal('modalManual');
        renderCards();
    }

    function saveStatus() {
        data[activeIdx].status = document.getElementById('selectStatus').value;
        data[activeIdx].dock = document.getElementById('selectDock').value;
        localStorage.setItem('antrian', JSON.stringify(data));
        toggleModal('modalStatus');
        renderCards();
    }

    function renderCards() {
        const cont = document.getElementById('antrianCardContainer');
        cont.innerHTML = data.length === 0 ? '<div class="card">Belum ada antrian.</div>' : '';
        data.filter(i => filter === 'Semua' || i.status === filter).forEach((item, idx) => {
            cont.innerHTML += `<div class="card">
                <div style="font-weight:bold; font-size:14px;">${item.id} - ${item.nopol}</div>
                <div>Sopir: ${item.sopir} | <strong>Status: ${item.status}</strong> ${item.dock !== '-' ? ' (Dock: '+item.dock+')' : ''}</div>
                <button class="btn" style="margin-top:8px;" onclick="activeIdx=${idx}; toggleModal('modalStatus')">Pindah Status</button>
            </div>`;
        });
    }
    renderCards();
</script>
</body>
</html>
