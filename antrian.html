<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Operator Antrian</title>
    <style>
        /* CSS INTERNAL: Desain Pastel Light Mode */
        body { background-color: #f8fafc; color: #334155; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; font-size: 12px; }
        .header { background: white; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .marquee { background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 0; overflow: hidden; white-space: nowrap; font-weight: 600; color: #475569; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #cbd5e1; font-weight: 600; background: white; }
        .btn-primary { background: #6366f1; color: white; border-color: #6366f1; }
        .form-group { margin-bottom: 10px; }
        .form-control { width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 12px; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 450px; }
        .tabs { display: flex; gap: 5px; border-bottom: 2px solid #e2e8f0; margin-bottom: 15px; overflow-x: auto; }
        .tab-btn { padding: 8px 16px; cursor: pointer; border: none; background: none; font-weight: 600; color: #64748b; }
        .tab-btn.active { border-bottom: 2px solid #6366f1; color: #6366f1; }
    </style>
</head>
<body>

<header class="header">
    <div style="font-weight:bold; font-size:16px;">Dashboard Operator Antrian</div>
    <div>
        <a href="monitoring.html" style="margin-right:15px; color:#6366f1;">Monitoring Utama</a>
        <a href="index.html" style="color:#6366f1;">Portal</a>
    </div>
</header>

<div class="marquee">
    <marquee scrollamount="6">
        🟢 Keluar: 4 Truk | 🔵 Lokal Proses: 4 Truk | ✅ Lokal Selesai: 4 Truk | 📦 Antrian: 1 Truk | 🚚 SUBDIST Proses: 3 Truk
    </marquee>
</div>

<div class="container">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <input type="text" id="searchInput" class="form-control" placeholder="Cari nomor/nama/no.pol..." style="width:70%;" oninput="renderAntrianCards()">
        <button class="btn btn-primary" onclick="toggleModal()">+ Daftar Manual Truk</button>
    </div>

    <div class="tabs" id="statusTabs">
        <button class="tab-btn active" onclick="filterStatus('Semua')">Semua</button>
        <button class="tab-btn" onclick="filterStatus('Antrian')">Antrian</button>
        <button class="tab-btn" onclick="filterStatus('Proses Muat')">Proses Muat</button>
    </div>

    <div id="antrianCardContainer"></div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h4 style="margin-top:0;">Daftar Manual Truk</h4>
        <form id="formManual" onsubmit="submitAntrian(event)">
            <div class="form-group"><input type="text" id="mSopir" class="form-control" required placeholder="Nama Sopir"></div>
            <div class="form-group"><input type="text" id="mNoPol" class="form-control" required placeholder="No Polisi"></div>
            <div class="form-group"><select id="mKategori" class="form-control"><option>LOKAL</option><option>EKSPOR</option></select></div>
            <button type="submit" class="btn btn-primary">Simpan Antrian</button>
            <button type="button" class="btn" onclick="toggleModal()">Batal</button>
        </form>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('antrian')) || [];
    let filter = 'Semua';

    function toggleModal() { const m = document.getElementById('modal'); m.style.display = (m.style.display === 'flex' ? 'none' : 'flex'); }
    
    function filterStatus(s) { filter = s; renderAntrianCards(); }

    function submitAntrian(e) {
        e.preventDefault();
        data.unshift({ id: "L0"+Math.floor(Math.random()*99), sopir: document.getElementById('mSopir').value, nopol: document.getElementById('mNoPol').value, status: 'Antrian' });
        localStorage.setItem('antrian', JSON.stringify(data));
        toggleModal();
        renderAntrianCards();
    }

    function renderAntrianCards() {
        const cont = document.getElementById('antrianCardContainer');
        cont.innerHTML = '';
        data.filter(i => filter === 'Semua' || i.status === filter).forEach((item, idx) => {
            cont.innerHTML += `<div class="card">
                <div style="font-weight:bold; color:#6366f1;">${item.id} - ${item.nopol}</div>
                <div>${item.sopir}</div>
                <div style="margin-top:5px;"><button class="btn" onclick="updateStatus(${idx}, 'Proses Muat')">Proses Muat</button></div>
            </div>`;
        });
    }

    function updateStatus(idx, s) { data[idx].status = s; localStorage.setItem('antrian', JSON.stringify(data)); renderAntrianCards(); }
    
    renderAntrianCards();
</script>
</body>
</html>
