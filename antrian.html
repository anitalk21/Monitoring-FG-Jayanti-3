<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Antrian - PT. Mayora Indah</title>
    <style>
        /* Desain Pastel Light Mode */
        body { background-color: #f8fafc; color: #475569; font-family: 'Segoe UI', sans-serif; margin: 0; font-size: 12px; }
        .header { background: white; border-bottom: 1px solid #e2e8f0; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; }
        .marquee { background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 20px; font-weight: 600; color: #64748b; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .btn { padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; border: 1px solid #cbd5e1; background: white; transition: 0.2s; }
        .btn-primary { background: #6366f1; color: white; border: none; }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; }
        
        /* Table Style untuk Pop-up */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>

<header class="header">
    <div style="font-weight:bold; font-size:15px; color:#1e293b;">Dashboard Antrian</div>
    <div>
        <button class="btn" onclick="toggleModal('modalManual')">+ Daftar Manual</button>
    </div>
</header>

<div class="marquee">
    <marquee scrollamount="5">🟢 Keluar: 4 Truk | 🔵 Lokal Proses: 4 Truk | 📦 Antrian: 1 Truk</marquee>
</div>

<div class="container">
    <input type="text" id="searchInput" class="form-control" placeholder="Cari..." style="margin-bottom:15px;" oninput="renderCards()">
    <div id="antrianCardContainer"></div>
</div>

<!-- MODAL DAFTAR MANUAL -->
<div id="modalManual" class="modal">
    <div class="modal-content">
        <h4>Ambil Nomor Antrian</h4>
        <form onsubmit="submitAntrian(event)">
            <div class="form-group"><input type="text" id="mSopir" placeholder="Nama Sopir" required></div>
            <button type="submit" class="btn btn-primary">Simpan</button>
        </form>
    </div>
</div>

<!-- MODAL PENGIRIMAN BARANG (OUTBOUND) -->
<div id="modalOutbound" class="modal">
    <div class="modal-content" style="width: 600px;">
        <h4 style="color:#e11d48;">Form Pengiriman & Outbound</h4>
        <div class="form-group">
            <label>Cari SKU Produk</label>
            <input type="text" id="skuSearch" placeholder="Ketik nama SKU..." oninput="checkSKU()">
        </div>
        <table>
            <tr><th>Lokasi</th><th>Stok</th><th>Karton Diambil</th></tr>
            <tr><td id="cellLoc">-</td><td id="cellStock">-</td><td><input type="number" id="qtyInput"></td></tr>
        </table>
        <p id="holdWarning" style="color:red; display:none; font-weight:bold;">Barang ini berstatus HOLD, tidak bisa diproses!</p>
        <button class="btn btn-primary" onclick="processOutbound()" style="margin-top:15px;">Proses Pengiriman Barang</button>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('antrian')) || [];
    let activeIdx = null;

    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex' ? 'none' : 'flex'); }
    
    function checkSKU() {
        const val = document.getElementById('skuSearch').value;
        // Simulasi deteksi status HOLD
        if(val.toLowerCase().includes('hold')) {
            document.getElementById('holdWarning').style.display = 'block';
        } else {
            document.getElementById('holdWarning').style.display = 'none';
        }
    }

    function processOutbound() {
        if(document.getElementById('holdWarning').style.display === 'block') return;
        alert('Pengiriman berhasil diproses!');
        toggleModal('modalOutbound');
    }

    function renderCards() {
        const cont = document.getElementById('antrianCardContainer');
        cont.innerHTML = '';
        data.forEach((item, idx) => {
            cont.innerHTML += `<div class="card">
                <div><strong>${item.id} - ${item.nopol}</strong></div>
                <div>Status: ${item.status}</div>
                <button class="btn" onclick="activeIdx=${idx}; toggleModal('modalOutbound')">Input Pengiriman</button>
            </div>`;
        });
    }
    
    function submitAntrian(e) {
        e.preventDefault();
        data.unshift({ id: "L0"+Math.floor(Math.random()*99), sopir: document.getElementById('mSopir').value, nopol: 'B 1234 XYZ', status: 'Antrian' });
        localStorage.setItem('antrian', JSON.stringify(data));
        toggleModal('modalManual');
        renderCards();
    }

    renderCards();
</script>
</body>
</html>
